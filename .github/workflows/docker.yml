name: Docker

# Multi-arch container image for GHCR, built straight from the multi-stage
# Dockerfile (no pre-built artifacts on the runner).
#
#   push to master   -> :edge + :sha-<short>
#   tag v1.2.3       -> :1.2.3, :1.2, :latest, :sha-<short>
#   pull request     -> linux/amd64 only, nothing pushed (validation)
#   workflow_dispatch-> same rules as a branch push
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build ${{ github.event_name == 'pull_request' && 'linux/amd64 (no push)' || 'linux/amd64 + linux/arm64' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image name
        # ghcr.io rejects uppercase paths; github.repository keeps the
        # repository's original casing (sinoserendipity/WarHutTV).
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Sanitize build-time config
        # data/config.json is tracked in the repo and holds a real password and
        # jwt_secret. Never bake that into a published image: overwrite it with
        # the placeholder example so the image only starts once the operator
        # mounts their own /data/config.json.
        run: install -D -m 0644 data/config.example.json data/config.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # NOTE: GITHUB_TOKEN can only push to a package this repository created,
        # or one it was explicitly granted <Write> on (package settings -> Manage
        # Actions access). A package left behind by a deleted/recreated repo is
        # not linked to the new one, and the push fails at the very last step
        # with "denied: permission_denied: write_package" -- the build itself
        # succeeds, which is why this shows up only in the push logs.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=warhutv
          cache-to: type=gha,mode=max,scope=warhutv
          provenance: true
          sbom: true

      - name: Smoke test
        # The image is scratch-based, so a broken binary, a missing CA bundle
        # or a lost frontend/dist would only show up at runtime. Start the
        # image against a throwaway config and hit an unauthenticated endpoint.
        run: |
          set -euo pipefail

          tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          echo "Smoke testing $tag"

          cfg="$(mktemp -d)"
          cat > "$cfg/config.json" <<JSON
          {
            "site_name": "warhutv-smoke",
            "announcement": "",
            "password": "$(openssl rand -hex 12)",
            "jwt_secret": "$(openssl rand -hex 32)",
            "api_site": {}
          }
          JSON

          trap 'docker rm -f warhutv-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name warhutv-smoke -p 18080:3000 \
            -v "$cfg:/data" "$tag" >/dev/null

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/version >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:18080/api/version
              echo
              echo "smoke test passed"
              exit 0
            fi
            sleep 1
          done

          echo "::group::container logs"
          docker logs warhutv-smoke 2>&1 || true
          echo "::endgroup::"
          echo "::error::/api/version never answered within 30s"
          exit 1
